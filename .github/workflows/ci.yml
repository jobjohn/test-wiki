# Wiki の CI。
# - check:     型チェックと自動テスト
# - build:     本番ビルド（next build）
# - storybook: Storybook のビルド
# - docker:    Docker イメージのビルドと起動確認（master への push、または Docker 関連ファイルを変えた PR のみ）
# secrets は使わず、権限は読み取りのみ。ブランチ保護では check と build を必須にすると安全です。
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# 同じ PR・ブランチで新しい実行が始まったら、古い実行を止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # node:sqlite の実験的機能の警告を出さない（Dockerfile と同じ）
  NODE_OPTIONS: --disable-warning=ExperimentalWarning

jobs:
  check:
    name: 型チェックとテスト
    runs-on: ubuntu-latest
    steps:
      - name: ソースの取得
        uses: actions/checkout@v4
      - name: Node.js の準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存パッケージのインストール
        run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: 自動テスト
        run: npx vitest run

  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - name: ソースの取得
        uses: actions/checkout@v4
      - name: Node.js の準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存パッケージのインストール
        run: npm ci
      # ソースが変わっても前回のキャッシュを足がかりに使えるよう、restore-keys は package-lock のみにする
      - name: Next.js のビルドキャッシュ
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: ビルド
        run: npx next build

  storybook:
    name: Storybook のビルド
    runs-on: ubuntu-latest
    steps:
      - name: ソースの取得
        uses: actions/checkout@v4
      - name: Node.js の準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存パッケージのインストール
        run: npm ci
      - name: Storybook のビルド
        run: npx storybook build --quiet

  docker:
    name: Docker イメージの起動確認
    runs-on: ubuntu-latest
    steps:
      - name: ソースの取得
        uses: actions/checkout@v4
      # 外部アクションを増やさないよう git diff で判定する。
      # PR では、取得されるマージ結果と master の差分（= その PR の変更）を見る。
      - name: Docker 関連ファイルの変更を確認
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qxE 'Dockerfile|\.dockerignore|package\.json|package-lock\.json|next\.config\.ts|compose\.yaml|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker 関連ファイルの変更がないため、以降を省略します"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Buildx の準備
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3
      - name: イメージのビルド
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wiki:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # データは /data、ポートは 3000（Dockerfile のとおり）。SECRET_KEY_BASE は未設定なら初回に自動生成される
      - name: コンテナの起動
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --name wiki-ci -p 3000:3000 \
            -e WIKI_ADMIN_EMAIL=ci@example.com \
            -e WIKI_ADMIN_PASSWORD=ci-password-123 \
            wiki:ci
      - name: 起動の確認（/up が 200 になるまで最大 60 秒）
        if: steps.changes.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/up || true)
            if [ "$code" = "200" ]; then
              echo "起動を確認しました（${i} 秒）"
              exit 0
            fi
            sleep 1
          done
          echo "60 秒以内に /up が 200 になりませんでした（最後の応答: $code）"
          exit 1
      - name: コンテナのログ
        if: failure() && steps.changes.outputs.run == 'true'
        run: docker logs wiki-ci
