services:
  wiki:
    build: .
    image: nextjs-wiki
    restart: unless-stopped
    ports:
      - "${WIKI_PORT:-3000}:3000"
    environment:
      # 初期ユーザー wikiadmin の初期パスワード（未指定なら "wikiadmin"。初回ログイン時に変更を求められます）
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Tokyo}
      # リバースプロキシで HTTPS 化している場合は true（Cookie に Secure を付けます）
      FORCE_SSL: ${FORCE_SSL:-}
    volumes:
      - wiki-data:/data

volumes:
  wiki-data:
